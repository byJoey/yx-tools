name: Build GUI Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 1.0.0)'
        required: false
        default: '1.0.0'

jobs:
  build-linux-x64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libfuse2 rpm
          pip install flet pyinstaller pillow
          pip install -r requirements-gui.txt
      
      - name: Build with Flet
        run: |
          flet pack -n yx-tools-gui -i icon/icon.png --add-data "cloudflare_speedtest.py:." --product-name "yx-tools-gui" cloudflare_speedtest_gui.py
      
      - name: Create packages
        run: |
          VERSION=${{ github.event.inputs.version || '1.0.0' }}
          
          # AppImage
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
          mkdir -p AppDir/usr/{bin,share/{applications,icons/hicolor/256x256/apps}}
          cp dist/yx-tools-gui AppDir/usr/bin/
          cp icon/icon.png AppDir/yx-tools-gui.png
          cp icon/icon.png AppDir/usr/share/icons/hicolor/256x256/apps/yx-tools-gui.png
          cat > AppDir/yx-tools-gui.desktop << 'EOF'
          [Desktop Entry]
          Name=yx-tools-gui
          Comment=Cloudflare IP Speed Test Tool
          Exec=yx-tools-gui
          Icon=yx-tools-gui
          Terminal=false
          Type=Application
          Categories=Network;
          StartupWMClass=flet
          EOF
          cp AppDir/yx-tools-gui.desktop AppDir/usr/share/applications/
          echo '#!/bin/bash' > AppDir/AppRun
          echo 'HERE=$(dirname "$(readlink -f "$0")")' >> AppDir/AppRun
          echo 'exec "${HERE}/usr/bin/yx-tools-gui" "$@"' >> AppDir/AppRun
          chmod +x AppDir/AppRun
          ARCH=x86_64 ./appimagetool AppDir yx-tools-gui-x86_64.AppImage
          
          # DEB
          mkdir -p deb-pkg/{DEBIAN,opt/yx-tools-gui,usr/{bin,share/{applications,icons/hicolor/256x256/apps}}}
          cp dist/yx-tools-gui deb-pkg/opt/yx-tools-gui/
          cp icon/icon.png deb-pkg/usr/share/icons/hicolor/256x256/apps/yx-tools-gui.png
          echo '#!/bin/bash' > deb-pkg/usr/bin/yx-tools-gui
          echo 'exec /opt/yx-tools-gui/yx-tools-gui "$@"' >> deb-pkg/usr/bin/yx-tools-gui
          chmod +x deb-pkg/usr/bin/yx-tools-gui
          sed 's|Exec=yx-tools-gui|Exec=/usr/bin/yx-tools-gui|' AppDir/yx-tools-gui.desktop > deb-pkg/usr/share/applications/yx-tools-gui.desktop
          cat > deb-pkg/DEBIAN/control << EOF
          Package: yx-tools-gui
          Version: ${VERSION}
          Architecture: amd64
          Maintainer: Joey and Zag
          Description: Cloudflare IP Speed Test Tool
          EOF
          dpkg-deb --build deb-pkg yx-tools-gui_${VERSION}_amd64.deb
          
          # RPM
          mkdir -p rpmbuild/{BUILD,RPMS,SPECS}
          cat > rpmbuild/SPECS/yx-tools-gui.spec << EOF
          Name: yx-tools-gui
          Version: ${VERSION}
          Release: 1
          Summary: Cloudflare IP Speed Test Tool
          License: MIT
          %description
          Cloudflare IP Speed Test Tool
          %install
          mkdir -p %{buildroot}/opt/yx-tools-gui %{buildroot}/usr/bin %{buildroot}/usr/share/applications %{buildroot}/usr/share/icons/hicolor/256x256/apps
          cp ${GITHUB_WORKSPACE}/dist/yx-tools-gui %{buildroot}/opt/yx-tools-gui/
          chmod +x %{buildroot}/opt/yx-tools-gui/yx-tools-gui
          cp ${GITHUB_WORKSPACE}/icon/icon.png %{buildroot}/usr/share/icons/hicolor/256x256/apps/yx-tools-gui.png
          echo '#!/bin/bash' > %{buildroot}/usr/bin/yx-tools-gui
          echo 'exec /opt/yx-tools-gui/yx-tools-gui "\$@"' >> %{buildroot}/usr/bin/yx-tools-gui
          chmod +x %{buildroot}/usr/bin/yx-tools-gui
          cp ${GITHUB_WORKSPACE}/AppDir/usr/share/applications/yx-tools-gui.desktop %{buildroot}/usr/share/applications/
          sed -i 's|Exec=yx-tools-gui|Exec=/usr/bin/yx-tools-gui|' %{buildroot}/usr/share/applications/yx-tools-gui.desktop
          %files
          /opt/yx-tools-gui/yx-tools-gui
          /usr/bin/yx-tools-gui
          /usr/share/applications/yx-tools-gui.desktop
          /usr/share/icons/hicolor/256x256/apps/yx-tools-gui.png
          EOF
          rpmbuild --define "_topdir ${GITHUB_WORKSPACE}/rpmbuild" -bb rpmbuild/SPECS/yx-tools-gui.spec
          cp rpmbuild/RPMS/x86_64/*.rpm yx-tools-gui-${VERSION}.x86_64.rpm
      
      - uses: actions/upload-artifact@v4
        with:
          name: rpm-x86_64
          path: yx-tools-gui-*.x86_64.rpm
          compression-level: 0
      
      - uses: actions/upload-artifact@v4
        with:
          name: deb-amd64
          path: yx-tools-gui_*_amd64.deb
          compression-level: 0
      
      - uses: actions/upload-artifact@v4
        with:
          name: appimage-x86_64
          path: yx-tools-gui-x86_64.AppImage
          compression-level: 0

  build-linux-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libfuse2 rpm
          pip install flet pyinstaller pillow
          pip install -r requirements-gui.txt
      - name: Build with Flet
        run: flet pack -n yx-tools-gui -i icon/icon.png --add-data "cloudflare_speedtest.py:." --product-name "yx-tools-gui" cloudflare_speedtest_gui.py
      - name: Create packages
        run: |
          VERSION=${{ github.event.inputs.version || '1.0.0' }}
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-aarch64.AppImage -O appimagetool
          chmod +x appimagetool
          ./appimagetool --appimage-extract
          mkdir -p AppDir/usr/{bin,share/{applications,icons/hicolor/256x256/apps}}
          cp dist/yx-tools-gui AppDir/usr/bin/
          cp icon/icon.png AppDir/yx-tools-gui.png
          cp icon/icon.png AppDir/usr/share/icons/hicolor/256x256/apps/yx-tools-gui.png
          cat > AppDir/yx-tools-gui.desktop << 'EOF'
          [Desktop Entry]
          Name=yx-tools-gui
          Comment=Cloudflare IP Speed Test Tool
          Exec=yx-tools-gui
          Icon=yx-tools-gui
          Terminal=false
          Type=Application
          Categories=Network;
          StartupWMClass=flet
          EOF
          cp AppDir/yx-tools-gui.desktop AppDir/usr/share/applications/
          echo '#!/bin/bash' > AppDir/AppRun
          echo 'HERE=$(dirname "$(readlink -f "$0")")' >> AppDir/AppRun
          echo 'exec "${HERE}/usr/bin/yx-tools-gui" "$@"' >> AppDir/AppRun
          chmod +x AppDir/AppRun
          export ARCH=aarch64 && ./squashfs-root/AppRun --no-appstream AppDir yx-tools-gui-aarch64.AppImage
          mkdir -p deb-pkg/{DEBIAN,opt/yx-tools-gui,usr/{bin,share/{applications,icons/hicolor/256x256/apps}}}
          cp dist/yx-tools-gui deb-pkg/opt/yx-tools-gui/
          cp icon/icon.png deb-pkg/usr/share/icons/hicolor/256x256/apps/yx-tools-gui.png
          echo '#!/bin/bash' > deb-pkg/usr/bin/yx-tools-gui
          echo 'exec /opt/yx-tools-gui/yx-tools-gui "$@"' >> deb-pkg/usr/bin/yx-tools-gui
          chmod +x deb-pkg/usr/bin/yx-tools-gui
          sed 's|Exec=yx-tools-gui|Exec=/usr/bin/yx-tools-gui|' AppDir/yx-tools-gui.desktop > deb-pkg/usr/share/applications/yx-tools-gui.desktop
          cat > deb-pkg/DEBIAN/control << EOF
          Package: yx-tools-gui
          Version: ${VERSION}
          Architecture: arm64
          Maintainer: Joey and Zag
          Description: Cloudflare IP Speed Test Tool
          EOF
          dpkg-deb --build deb-pkg yx-tools-gui_${VERSION}_arm64.deb
          mkdir -p rpmbuild/{BUILD,RPMS,SPECS}
          cat > rpmbuild/SPECS/yx-tools-gui.spec << EOF
          Name: yx-tools-gui
          Version: ${VERSION}
          Release: 1
          Summary: Cloudflare IP Speed Test Tool
          License: MIT
          %description
          Cloudflare IP Speed Test Tool
          %install
          mkdir -p %{buildroot}/opt/yx-tools-gui %{buildroot}/usr/bin %{buildroot}/usr/share/applications %{buildroot}/usr/share/icons/hicolor/256x256/apps
          cp ${GITHUB_WORKSPACE}/dist/yx-tools-gui %{buildroot}/opt/yx-tools-gui/
          chmod +x %{buildroot}/opt/yx-tools-gui/yx-tools-gui
          cp ${GITHUB_WORKSPACE}/icon/icon.png %{buildroot}/usr/share/icons/hicolor/256x256/apps/yx-tools-gui.png
          echo '#!/bin/bash' > %{buildroot}/usr/bin/yx-tools-gui
          echo 'exec /opt/yx-tools-gui/yx-tools-gui "\$@"' >> %{buildroot}/usr/bin/yx-tools-gui
          chmod +x %{buildroot}/usr/bin/yx-tools-gui
          cp ${GITHUB_WORKSPACE}/AppDir/usr/share/applications/yx-tools-gui.desktop %{buildroot}/usr/share/applications/
          sed -i 's|Exec=yx-tools-gui|Exec=/usr/bin/yx-tools-gui|' %{buildroot}/usr/share/applications/yx-tools-gui.desktop
          %files
          /opt/yx-tools-gui/yx-tools-gui
          /usr/bin/yx-tools-gui
          /usr/share/applications/yx-tools-gui.desktop
          /usr/share/icons/hicolor/256x256/apps/yx-tools-gui.png
          EOF
          rpmbuild --define "_topdir ${GITHUB_WORKSPACE}/rpmbuild" -bb rpmbuild/SPECS/yx-tools-gui.spec
          cp rpmbuild/RPMS/aarch64/*.rpm yx-tools-gui-${VERSION}.aarch64.rpm
      - uses: actions/upload-artifact@v4
        with:
          name: rpm-aarch64
          path: yx-tools-gui-*.aarch64.rpm
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: deb-arm64
          path: yx-tools-gui_*_arm64.deb
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: appimage-aarch64
          path: yx-tools-gui-aarch64.AppImage
          compression-level: 0

  build-windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install flet pyinstaller pillow
          pip install -r requirements-gui.txt
      - name: Build with Flet
        run: |
          flet pack -n yx-tools-gui -i icon/icon.png --add-data "cloudflare_speedtest.py;." --product-name "yx-tools-gui" cloudflare_speedtest_gui.py
          Rename-Item -Path "dist/yx-tools-gui.exe" -NewName "yx-tools-gui-x64.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: exe-x64
          path: dist/yx-tools-gui-x64.exe
          compression-level: 0

  build-windows-arm64:
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install flet pyinstaller pillow
          pip install -r requirements-gui.txt
      - name: Build with Flet
        run: |
          flet pack -n yx-tools-gui -i icon/icon.png --add-data "cloudflare_speedtest.py;." --product-name "yx-tools-gui" cloudflare_speedtest_gui.py
          Rename-Item -Path "dist/yx-tools-gui.exe" -NewName "yx-tools-gui-arm64.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: exe-arm64
          path: dist/yx-tools-gui-arm64.exe
          compression-level: 0

  build-macos-intel:
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install flet pyinstaller pillow
          pip install -r requirements-gui.txt
      - name: Create ICNS icon
        run: |
          mkdir -p icon.iconset
          sips -z 16 16 icon/icon.png --out icon.iconset/icon_16x16.png
          sips -z 32 32 icon/icon.png --out icon.iconset/icon_16x16@2x.png
          sips -z 32 32 icon/icon.png --out icon.iconset/icon_32x32.png
          sips -z 64 64 icon/icon.png --out icon.iconset/icon_32x32@2x.png
          sips -z 128 128 icon/icon.png --out icon.iconset/icon_128x128.png
          sips -z 256 256 icon/icon.png --out icon.iconset/icon_128x128@2x.png
          sips -z 256 256 icon/icon.png --out icon.iconset/icon_256x256.png
          sips -z 512 512 icon/icon.png --out icon.iconset/icon_256x256@2x.png
          sips -z 512 512 icon/icon.png --out icon.iconset/icon_512x512.png
          cp icon/icon.png icon.iconset/icon_512x512@2x.png
          iconutil -c icns icon.iconset -o icon/icon.icns
      - name: Build with Flet
        run: |
          flet pack -n yx-tools-gui -i icon/icon.icns --add-data "cloudflare_speedtest.py:." --product-name "yx-tools-gui" --bundle-id "com.yxtools.gui" cloudflare_speedtest_gui.py
      - name: Fix macOS app bundle
        run: |
          APP_PATH="dist/yx-tools-gui.app"
          # 替换所有图标文件
          find "$APP_PATH/Contents/Resources" -name "*.icns" -exec cp icon/icon.icns {} \;
          # 修改 Info.plist 确保应用名称正确
          /usr/libexec/PlistBuddy -c "Set :CFBundleName yx-tools-gui" "$APP_PATH/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName yx-tools-gui" "$APP_PATH/Contents/Info.plist" 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string yx-tools-gui" "$APP_PATH/Contents/Info.plist"
          # 清除图标缓存
          touch "$APP_PATH"
      - name: Create DMG
        run: |
          VERSION=${{ github.event.inputs.version || '1.0.0' }}
          brew install create-dmg
          create-dmg --volname "yx-tools-gui" --window-size 600 400 --icon-size 100 --icon "yx-tools-gui.app" 150 185 --app-drop-link 450 185 "yx-tools-gui-${VERSION}-intel.dmg" "dist/yx-tools-gui.app" || hdiutil create -volname "yx-tools-gui" -srcfolder dist/yx-tools-gui.app -ov -format UDZO "yx-tools-gui-${VERSION}-intel.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: dmg-intel
          path: yx-tools-gui-*-intel.dmg
          compression-level: 0

  build-macos-arm:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install flet pyinstaller pillow
          pip install -r requirements-gui.txt
      - name: Create ICNS icon
        run: |
          mkdir -p icon.iconset
          sips -z 16 16 icon/icon.png --out icon.iconset/icon_16x16.png
          sips -z 32 32 icon/icon.png --out icon.iconset/icon_16x16@2x.png
          sips -z 32 32 icon/icon.png --out icon.iconset/icon_32x32.png
          sips -z 64 64 icon/icon.png --out icon.iconset/icon_32x32@2x.png
          sips -z 128 128 icon/icon.png --out icon.iconset/icon_128x128.png
          sips -z 256 256 icon/icon.png --out icon.iconset/icon_128x128@2x.png
          sips -z 256 256 icon/icon.png --out icon.iconset/icon_256x256.png
          sips -z 512 512 icon/icon.png --out icon.iconset/icon_256x256@2x.png
          sips -z 512 512 icon/icon.png --out icon.iconset/icon_512x512.png
          cp icon/icon.png icon.iconset/icon_512x512@2x.png
          iconutil -c icns icon.iconset -o icon/icon.icns
      - name: Build with Flet
        run: |
          flet pack -n yx-tools-gui -i icon/icon.icns --add-data "cloudflare_speedtest.py:." --product-name "yx-tools-gui" --bundle-id "com.yxtools.gui" cloudflare_speedtest_gui.py
      - name: Fix macOS app bundle
        run: |
          APP_PATH="dist/yx-tools-gui.app"
          # 替换所有图标文件
          find "$APP_PATH/Contents/Resources" -name "*.icns" -exec cp icon/icon.icns {} \;
          # 修改 Info.plist 确保应用名称正确
          /usr/libexec/PlistBuddy -c "Set :CFBundleName yx-tools-gui" "$APP_PATH/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName yx-tools-gui" "$APP_PATH/Contents/Info.plist" 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string yx-tools-gui" "$APP_PATH/Contents/Info.plist"
          # 清除图标缓存
          touch "$APP_PATH"
      - name: Create DMG
        run: |
          VERSION=${{ github.event.inputs.version || '1.0.0' }}
          brew install create-dmg
          create-dmg --volname "yx-tools-gui" --window-size 600 400 --icon-size 100 --icon "yx-tools-gui.app" 150 185 --app-drop-link 450 185 "yx-tools-gui-${VERSION}-apple-silicon.dmg" "dist/yx-tools-gui.app" || hdiutil create -volname "yx-tools-gui" -srcfolder dist/yx-tools-gui.app -ov -format UDZO "yx-tools-gui-${VERSION}-apple-silicon.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: dmg-apple-silicon
          path: yx-tools-gui-*-apple-silicon.dmg
          compression-level: 0

  release:
    needs: [build-linux-x64, build-linux-arm64, build-windows-x64, build-windows-arm64, build-macos-intel, build-macos-arm]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - run: ls -la artifacts/
      - uses: softprops/action-gh-release@v1
        with:
          files: artifacts/*
          draft: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
