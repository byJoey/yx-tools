name: Build GUI Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 1.0.0)'
        required: false
        default: '1.0.0'

jobs:
  build-linux-x64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev ninja-build libfuse2 rpm clang cmake
          pip install flet
          pip install -r requirements-gui.txt
      - name: Build with Flet
        run: flet build linux --project "yx-tools-gui" --product "yx-tools-gui" --org "com.yxtools" --build-version "${{ github.event.inputs.version || '1.0.0' }}"
      - name: Create desktop file
        run: |
          cat > yx-tools-gui.desktop << 'DESKTOP_EOF'
          [Desktop Entry]
          Name=yx-tools-gui
          Comment=Cloudflare IP Speed Test Tool
          Exec=yx-tools-gui
          Icon=yx-tools-gui
          Terminal=false
          Type=Application
          Categories=Network;
          DESKTOP_EOF
          sed -i 's/^          //' yx-tools-gui.desktop
      - name: Create AppImage
        run: |
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
          mkdir -p AppDir/usr/{bin,share/{applications,icons/hicolor/256x256/apps}}
          cp build/linux/yx-tools-gui AppDir/usr/bin/
          cp icon/icon.png AppDir/yx-tools-gui.png
          cp icon/icon.png AppDir/usr/share/icons/hicolor/256x256/apps/yx-tools-gui.png
          cp yx-tools-gui.desktop AppDir/
          cp yx-tools-gui.desktop AppDir/usr/share/applications/
          echo '#!/bin/bash' > AppDir/AppRun
          echo 'HERE=$(dirname "$(readlink -f "$0")")' >> AppDir/AppRun
          echo 'exec "${HERE}/usr/bin/yx-tools-gui" "$@"' >> AppDir/AppRun
          chmod +x AppDir/AppRun
          ARCH=x86_64 ./appimagetool AppDir yx-tools-gui-x86_64.AppImage
      - name: Create DEB
        run: |
          VERSION=${{ github.event.inputs.version || '1.0.0' }}
          mkdir -p deb-pkg/{DEBIAN,opt/yx-tools-gui,usr/{bin,share/{applications,icons/hicolor/256x256/apps}}}
          cp build/linux/yx-tools-gui deb-pkg/opt/yx-tools-gui/
          cp icon/icon.png deb-pkg/usr/share/icons/hicolor/256x256/apps/yx-tools-gui.png
          echo '#!/bin/bash' > deb-pkg/usr/bin/yx-tools-gui
          echo 'exec /opt/yx-tools-gui/yx-tools-gui "$@"' >> deb-pkg/usr/bin/yx-tools-gui
          chmod +x deb-pkg/usr/bin/yx-tools-gui
          sed 's|Exec=yx-tools-gui|Exec=/usr/bin/yx-tools-gui|' yx-tools-gui.desktop > deb-pkg/usr/share/applications/yx-tools-gui.desktop
          echo "Package: yx-tools-gui" > deb-pkg/DEBIAN/control
          echo "Version: ${VERSION}" >> deb-pkg/DEBIAN/control
          echo "Architecture: amd64" >> deb-pkg/DEBIAN/control
          echo "Maintainer: Joey and Zag" >> deb-pkg/DEBIAN/control
          echo "Description: Cloudflare IP Speed Test Tool" >> deb-pkg/DEBIAN/control
          dpkg-deb --build deb-pkg yx-tools-gui_${VERSION}_amd64.deb
      - name: Create RPM
        run: |
          VERSION=${{ github.event.inputs.version || '1.0.0' }}
          mkdir -p rpmbuild/{BUILD,RPMS,SPECS}
          cat > rpmbuild/SPECS/yx-tools-gui.spec << 'SPEC_EOF'
          Name: yx-tools-gui
          Version: VERSION_PLACEHOLDER
          Release: 1
          Summary: Cloudflare IP Speed Test Tool
          License: MIT
          %description
          Cloudflare IP Speed Test Tool
          %install
          mkdir -p %{buildroot}/opt/yx-tools-gui %{buildroot}/usr/bin %{buildroot}/usr/share/applications %{buildroot}/usr/share/icons/hicolor/256x256/apps
          cp %{_sourcedir}/yx-tools-gui %{buildroot}/opt/yx-tools-gui/
          chmod +x %{buildroot}/opt/yx-tools-gui/yx-tools-gui
          cp %{_sourcedir}/icon.png %{buildroot}/usr/share/icons/hicolor/256x256/apps/yx-tools-gui.png
          echo '#!/bin/bash' > %{buildroot}/usr/bin/yx-tools-gui
          echo 'exec /opt/yx-tools-gui/yx-tools-gui "$@"' >> %{buildroot}/usr/bin/yx-tools-gui
          chmod +x %{buildroot}/usr/bin/yx-tools-gui
          cp %{_sourcedir}/yx-tools-gui.desktop %{buildroot}/usr/share/applications/
          %files
          /opt/yx-tools-gui/yx-tools-gui
          /usr/bin/yx-tools-gui
          /usr/share/applications/yx-tools-gui.desktop
          /usr/share/icons/hicolor/256x256/apps/yx-tools-gui.png
          SPEC_EOF
          sed -i 's/^          //' rpmbuild/SPECS/yx-tools-gui.spec
          sed -i "s/VERSION_PLACEHOLDER/${VERSION}/" rpmbuild/SPECS/yx-tools-gui.spec
          mkdir -p rpmbuild/SOURCES
          cp build/linux/yx-tools-gui rpmbuild/SOURCES/
          cp icon/icon.png rpmbuild/SOURCES/
          sed 's|Exec=yx-tools-gui|Exec=/usr/bin/yx-tools-gui|' yx-tools-gui.desktop > rpmbuild/SOURCES/yx-tools-gui.desktop
          rpmbuild --define "_topdir ${GITHUB_WORKSPACE}/rpmbuild" -bb rpmbuild/SPECS/yx-tools-gui.spec
          cp rpmbuild/RPMS/x86_64/*.rpm yx-tools-gui-${VERSION}.x86_64.rpm
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64-packages
          path: |
            yx-tools-gui-*.x86_64.rpm
            yx-tools-gui_*_amd64.deb
            yx-tools-gui-x86_64.AppImage
          compression-level: 0

  build-linux-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev ninja-build libfuse2 rpm clang cmake
          pip install flet
          pip install -r requirements-gui.txt
      - name: Build with Flet
        run: flet build linux --project "yx-tools-gui" --product "yx-tools-gui" --org "com.yxtools" --build-version "${{ github.event.inputs.version || '1.0.0' }}"
      - name: Create desktop file
        run: |
          cat > yx-tools-gui.desktop << 'DESKTOP_EOF'
          [Desktop Entry]
          Name=yx-tools-gui
          Comment=Cloudflare IP Speed Test Tool
          Exec=yx-tools-gui
          Icon=yx-tools-gui
          Terminal=false
          Type=Application
          Categories=Network;
          DESKTOP_EOF
          sed -i 's/^          //' yx-tools-gui.desktop
      - name: Create AppImage
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-aarch64.AppImage -O linuxdeploy
          chmod +x linuxdeploy
          ./linuxdeploy --appimage-extract
          mkdir -p AppDir/usr/bin
          cp build/linux/yx-tools-gui AppDir/usr/bin/
          cp icon/icon.png yx-tools-gui.png
          ./squashfs-root/AppRun --appdir AppDir -e build/linux/yx-tools-gui -i yx-tools-gui.png -d yx-tools-gui.desktop --output appimage || echo "AppImage build skipped"
          mv *.AppImage yx-tools-gui-aarch64.AppImage 2>/dev/null || touch yx-tools-gui-aarch64.AppImage.skip
      - name: Create DEB
        run: |
          VERSION=${{ github.event.inputs.version || '1.0.0' }}
          mkdir -p deb-pkg/{DEBIAN,opt/yx-tools-gui,usr/{bin,share/{applications,icons/hicolor/256x256/apps}}}
          cp build/linux/yx-tools-gui deb-pkg/opt/yx-tools-gui/
          cp icon/icon.png deb-pkg/usr/share/icons/hicolor/256x256/apps/yx-tools-gui.png
          echo '#!/bin/bash' > deb-pkg/usr/bin/yx-tools-gui
          echo 'exec /opt/yx-tools-gui/yx-tools-gui "$@"' >> deb-pkg/usr/bin/yx-tools-gui
          chmod +x deb-pkg/usr/bin/yx-tools-gui
          sed 's|Exec=yx-tools-gui|Exec=/usr/bin/yx-tools-gui|' yx-tools-gui.desktop > deb-pkg/usr/share/applications/yx-tools-gui.desktop
          echo "Package: yx-tools-gui" > deb-pkg/DEBIAN/control
          echo "Version: ${VERSION}" >> deb-pkg/DEBIAN/control
          echo "Architecture: arm64" >> deb-pkg/DEBIAN/control
          echo "Maintainer: Joey and Zag" >> deb-pkg/DEBIAN/control
          echo "Description: Cloudflare IP Speed Test Tool" >> deb-pkg/DEBIAN/control
          dpkg-deb --build deb-pkg yx-tools-gui_${VERSION}_arm64.deb
      - name: Create RPM
        run: |
          VERSION=${{ github.event.inputs.version || '1.0.0' }}
          mkdir -p rpmbuild/{BUILD,RPMS,SPECS,SOURCES}
          cat > rpmbuild/SPECS/yx-tools-gui.spec << 'SPEC_EOF'
          Name: yx-tools-gui
          Version: VERSION_PLACEHOLDER
          Release: 1
          Summary: Cloudflare IP Speed Test Tool
          License: MIT
          %description
          Cloudflare IP Speed Test Tool
          %install
          mkdir -p %{buildroot}/opt/yx-tools-gui %{buildroot}/usr/bin %{buildroot}/usr/share/applications %{buildroot}/usr/share/icons/hicolor/256x256/apps
          cp %{_sourcedir}/yx-tools-gui %{buildroot}/opt/yx-tools-gui/
          chmod +x %{buildroot}/opt/yx-tools-gui/yx-tools-gui
          cp %{_sourcedir}/icon.png %{buildroot}/usr/share/icons/hicolor/256x256/apps/yx-tools-gui.png
          echo '#!/bin/bash' > %{buildroot}/usr/bin/yx-tools-gui
          echo 'exec /opt/yx-tools-gui/yx-tools-gui "$@"' >> %{buildroot}/usr/bin/yx-tools-gui
          chmod +x %{buildroot}/usr/bin/yx-tools-gui
          cp %{_sourcedir}/yx-tools-gui.desktop %{buildroot}/usr/share/applications/
          %files
          /opt/yx-tools-gui/yx-tools-gui
          /usr/bin/yx-tools-gui
          /usr/share/applications/yx-tools-gui.desktop
          /usr/share/icons/hicolor/256x256/apps/yx-tools-gui.png
          SPEC_EOF
          sed -i 's/^          //' rpmbuild/SPECS/yx-tools-gui.spec
          sed -i "s/VERSION_PLACEHOLDER/${VERSION}/" rpmbuild/SPECS/yx-tools-gui.spec
          cp build/linux/yx-tools-gui rpmbuild/SOURCES/
          cp icon/icon.png rpmbuild/SOURCES/
          sed 's|Exec=yx-tools-gui|Exec=/usr/bin/yx-tools-gui|' yx-tools-gui.desktop > rpmbuild/SOURCES/yx-tools-gui.desktop
          rpmbuild --define "_topdir ${GITHUB_WORKSPACE}/rpmbuild" -bb rpmbuild/SPECS/yx-tools-gui.spec
          cp rpmbuild/RPMS/aarch64/*.rpm yx-tools-gui-${VERSION}.aarch64.rpm
      - uses: actions/upload-artifact@v4
        with:
          name: linux-arm64-packages
          path: |
            yx-tools-gui-*.aarch64.rpm
            yx-tools-gui_*_arm64.deb
            yx-tools-gui-aarch64.AppImage*
          compression-level: 0

  build-windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
      - name: Install dependencies
        run: |
          pip install flet
          pip install -r requirements-gui.txt
      - name: Build with Flet
        run: flet build windows --project "yx-tools-gui" --product "yx-tools-gui" --org "com.yxtools" --build-version "${{ github.event.inputs.version || '1.0.0' }}"
      - name: Package
        run: Rename-Item -Path "build/windows/yx-tools-gui.exe" -NewName "yx-tools-gui-x64.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: exe-x64
          path: build/windows/yx-tools-gui-x64.exe
          compression-level: 0

  build-windows-arm64:
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
      - name: Install dependencies
        run: |
          pip install flet
          pip install -r requirements-gui.txt
      - name: Build with Flet
        run: flet build windows --project "yx-tools-gui" --product "yx-tools-gui" --org "com.yxtools" --build-version "${{ github.event.inputs.version || '1.0.0' }}"
      - name: Package
        run: Rename-Item -Path "build/windows/yx-tools-gui.exe" -NewName "yx-tools-gui-arm64.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: exe-arm64
          path: build/windows/yx-tools-gui-arm64.exe
          compression-level: 0

  build-macos-intel:
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
      - name: Install dependencies
        run: |
          pip install flet
          pip install -r requirements-gui.txt
      - name: Build with Flet
        run: flet build macos --project "yx-tools-gui" --product "yx-tools-gui" --org "com.yxtools" --build-version "${{ github.event.inputs.version || '1.0.0' }}"
      - name: Create DMG
        run: |
          VERSION=${{ github.event.inputs.version || '1.0.0' }}
          brew install create-dmg
          create-dmg --volname "yx-tools-gui" --window-size 600 400 --icon-size 100 --icon "yx-tools-gui.app" 150 185 --app-drop-link 450 185 "yx-tools-gui-${VERSION}-intel.dmg" "build/macos/yx-tools-gui.app" || hdiutil create -volname "yx-tools-gui" -srcfolder build/macos/yx-tools-gui.app -ov -format UDZO "yx-tools-gui-${VERSION}-intel.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: dmg-intel
          path: yx-tools-gui-*-intel.dmg
          compression-level: 0

  build-macos-arm:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
      - name: Install dependencies
        run: |
          pip install flet
          pip install -r requirements-gui.txt
      - name: Build with Flet
        run: flet build macos --project "yx-tools-gui" --product "yx-tools-gui" --org "com.yxtools" --build-version "${{ github.event.inputs.version || '1.0.0' }}"
      - name: Create DMG
        run: |
          VERSION=${{ github.event.inputs.version || '1.0.0' }}
          brew install create-dmg
          create-dmg --volname "yx-tools-gui" --window-size 600 400 --icon-size 100 --icon "yx-tools-gui.app" 150 185 --app-drop-link 450 185 "yx-tools-gui-${VERSION}-apple-silicon.dmg" "build/macos/yx-tools-gui.app" || hdiutil create -volname "yx-tools-gui" -srcfolder build/macos/yx-tools-gui.app -ov -format UDZO "yx-tools-gui-${VERSION}-apple-silicon.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: dmg-apple-silicon
          path: yx-tools-gui-*-apple-silicon.dmg
          compression-level: 0

  release:
    needs: [build-linux-x64, build-linux-arm64, build-windows-x64, build-windows-arm64, build-macos-intel, build-macos-arm]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - run: ls -la artifacts/
      - uses: softprops/action-gh-release@v1
        with:
          files: artifacts/*
          draft: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
