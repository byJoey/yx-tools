name: Build GUI Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 1.0.0)'
        required: false
        default: '1.0.0'

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
          pip install flet pyinstaller
          pip install -r requirements-gui.txt
      
      - name: Build with Flet
        run: |
          flet pack -n yx-tools-gui \
            -i icon/icon.png \
            --add-data "cloudflare_speedtest.py:." \
            --product-name "yx-tools-gui" \
            cloudflare_speedtest_gui.py
      
      - name: Create AppImage
        run: |
          # 下载 appimagetool
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
          
          # 创建 AppDir 结构
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
          
          cp dist/yx-tools-gui AppDir/usr/bin/
          cp icon/icon.png AppDir/yx-tools-gui.png
          cp icon/icon.png AppDir/usr/share/icons/hicolor/256x256/apps/yx-tools-gui.png
          
          cat > AppDir/yx-tools-gui.desktop << EOF
          [Desktop Entry]
          Name=yx-tools-gui
          Name[zh_CN]=优选IP测速工具
          Comment=Cloudflare 优选 IP 测速工具
          Exec=yx-tools-gui
          Icon=yx-tools-gui
          Terminal=false
          Type=Application
          Categories=Network;Utility;
          StartupWMClass=flet
          EOF
          
          cp AppDir/yx-tools-gui.desktop AppDir/usr/share/applications/
          
          cat > AppDir/AppRun << 'EOF'
          #!/bin/bash
          SELF=$(readlink -f "$0")
          HERE=${SELF%/*}
          exec "${HERE}/usr/bin/yx-tools-gui" "$@"
          EOF
          chmod +x AppDir/AppRun
          
          # 构建 AppImage
          ARCH=x86_64 ./appimagetool AppDir dist/yx-tools-gui-x86_64.AppImage
      
      - name: Create DEB package
        run: |
          mkdir -p deb-pkg/DEBIAN
          mkdir -p deb-pkg/opt/yx-tools-gui
          mkdir -p deb-pkg/usr/bin
          mkdir -p deb-pkg/usr/share/applications
          mkdir -p deb-pkg/usr/share/icons/hicolor/256x256/apps
          
          cp dist/yx-tools-gui deb-pkg/opt/yx-tools-gui/
          cp icon/icon.png deb-pkg/usr/share/icons/hicolor/256x256/apps/yx-tools-gui.png
          
          cat > deb-pkg/usr/bin/yx-tools-gui << 'EOF'
          #!/bin/bash
          exec /opt/yx-tools-gui/yx-tools-gui "$@"
          EOF
          chmod +x deb-pkg/usr/bin/yx-tools-gui
          
          cat > deb-pkg/usr/share/applications/yx-tools-gui.desktop << EOF
          [Desktop Entry]
          Name=yx-tools-gui
          Name[zh_CN]=优选IP测速工具
          Comment=Cloudflare 优选 IP 测速工具
          Exec=/usr/bin/yx-tools-gui
          Icon=yx-tools-gui
          Terminal=false
          Type=Application
          Categories=Network;Utility;
          StartupWMClass=flet
          EOF
          
          cat > deb-pkg/DEBIAN/control << EOF
          Package: yx-tools-gui
          Version: ${{ github.event.inputs.version || '1.0.0' }}
          Section: net
          Priority: optional
          Architecture: amd64
          Maintainer: Joey & Zag
          Description: Cloudflare 优选 IP 测速工具
           基于 Flet 的跨平台图形界面工具
          EOF
          
          dpkg-deb --build deb-pkg dist/yx-tools-gui_${{ github.event.inputs.version || '1.0.0' }}_amd64.deb
      
      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            dist/yx-tools-gui
            dist/yx-tools-gui-x86_64.AppImage
            dist/yx-tools-gui_*.deb

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install flet pyinstaller
          pip install -r requirements-gui.txt
      
      - name: Build with Flet
        run: |
          flet pack -n yx-tools-gui `
            -i icon/icon.png `
            --add-data "cloudflare_speedtest.py;." `
            --product-name "yx-tools-gui" `
            --file-description "Cloudflare 优选 IP 测速工具" `
            --product-version "${{ github.event.inputs.version || '1.0.0' }}" `
            --company-name "Joey & Zag" `
            cloudflare_speedtest_gui.py
      
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/yx-tools-gui.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install flet pyinstaller
          pip install -r requirements-gui.txt
      
      - name: Build with Flet
        run: |
          flet pack -n yx-tools-gui \
            -i icon/icon.png \
            --add-data "cloudflare_speedtest.py:." \
            --product-name "yx-tools-gui" \
            --bundle-id "com.yxtools.gui" \
            cloudflare_speedtest_gui.py
      
      - name: Create DMG
        run: |
          # 安装 create-dmg
          brew install create-dmg
          
          # 创建 DMG
          create-dmg \
            --volname "yx-tools-gui" \
            --volicon "icon/icon.png" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "yx-tools-gui.app" 150 185 \
            --app-drop-link 450 185 \
            "dist/yx-tools-gui-${{ github.event.inputs.version || '1.0.0' }}.dmg" \
            "dist/yx-tools-gui.app" || true
          
          # 如果 create-dmg 失败，使用 hdiutil
          if [ ! -f "dist/yx-tools-gui-${{ github.event.inputs.version || '1.0.0' }}.dmg" ]; then
            hdiutil create -volname "yx-tools-gui" -srcfolder dist/yx-tools-gui.app -ov -format UDZO "dist/yx-tools-gui-${{ github.event.inputs.version || '1.0.0' }}.dmg"
          fi
      
      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: |
            dist/yx-tools-gui.app
            dist/yx-tools-gui-*.dmg

  release:
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      
      - name: Display structure
        run: ls -R artifacts
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/linux-packages/*
            artifacts/windows-exe/*
            artifacts/macos-dmg/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
